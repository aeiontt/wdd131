<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Discover Nigeria, its culture, attractions, weather, and landmarks.">

    <meta name="author"
        content="Bamisile Oluwadamilare Emmanuel">

    <title>Nigeria Country Page</title>

    <link rel="stylesheet" href="styles/place.css">

    <script src="scripts/place.js" defer></script>

</head>

<body>

    <header>

        <h1>Nigeria</h1>

    </header>

    <main>

        <!-- HERO SECTION -->

        <section class="hero">

            <picture>

                <source media="(min-width: 768px)"
                    srcset="images/hero-large.webp">

                <img src="images/hero-small.webp"
                    alt="Beautiful view of Nigeria">

            </picture>

        </section>

        <!-- DATA SECTION -->

        <section class="card data">

            <h2>Data</h2>

            <p><strong>Capital:</strong> Abuja</p>

            <p><strong>Population:</strong> 223 Million</p>

            <p><strong>Language:</strong> English</p>

            <p><strong>Currency:</strong> Naira</p>

            <p><strong>Continent:</strong> Africa</p>

        </section>

        <!-- WEATHER SECTION -->

        <section class="card weather">

            <h2>Weather</h2>

            <img src="images/weather-icon.svg"
                alt="Weather Icon"
                class="weather-icon">

            <p><strong>Temperature:</strong>
                <span id="temperature">28</span>°C
            </p>

            <p><strong>Wind Speed:</strong>
                <span id="windspeed">10</span> km/h
            </p>

            <p><strong>Wind Chill:</strong>
                <span id="windchill"></span>
            </p>

        </section>

    </main>

    <footer>

        <p>
            &copy;
            <span id="currentyear"></span>
            | Bamisile Oluwadamilare Emmanuel
            | Nigeria
        </p>

        <p id="lastModified"></p>

    </footer>

</body>

</html>
