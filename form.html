<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 131 - Review Form</title>
    <meta name="description" content="WDD 131 Final Project - Review Form">
    <link rel="stylesheet" href="styles/base.css">
    <script src="scripts/main.js" defer></script>
</head>
<body>
    <header>
        <span id="course-title">WDD 131 Capstone</span>
        <nav>
            <a href="index.html">Home</a>
            <a href="place.html">Places</a>
            <a href="form.html">Review</a>
        </nav>
    </header>
    <main>
        <h1>Submit a Review</h1>
        <form method="get" action="form.html" class="review-form" id="reviewForm">
            <label for="productName">Select Place:</label>
            <select id="productName" name="productName" required>
                <option value="" disabled selected>Select a Place ...</option>
                <option value="lagos">Lagos</option>
                <option value="tokyo">Tokyo</option>
                <option value="jakarta">Jakarta</option>
            </select>

            <fieldset>
                <legend>Overall Rating</legend>
                <label><input type="radio" name="rating" value="1" required> 1 Star</label>
                <label><input type="radio" name="rating" value="2"> 2 Stars</label>
                <label><input type="radio" name="rating" value="3"> 3 Stars</label>
                <label><input type="radio" name="rating" value="4"> 4 Stars</label>
                <label><input type="radio" name="rating" value="5"> 5 Stars</label>
            </fieldset>

            <label for="visitDate">Date of Visit:</label>
            <input type="date" id="visitDate" name="visitDate" required>

            <label for="writtenReview">Written Review (Optional):</label>
            <textarea id="writtenReview" name="writtenReview" rows="4"></textarea>

            <input type="submit" value="Submit Review">
        </form>
    </main>
    <footer>
        <p>&copy; <span id="currentyear"></span> | Dairy | Nigeria</p>
        <p id="lastModified"></p>
        <p id="review-count"></p>
    </footer>
</body>
</html>
