<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html" class="review-form">
            <div class="form-group">
                <label for="product-name">Product Name <span class="required">*</span></label>
                <select id="product-name" name="productName" required>
                    <option value="" disabled selected>Select a Product ...</option>
                    </select>
            </div>

            <fieldset class="form-group">
                <legend>Overall Rating <span class="required">*</span></legend>
                <div class="rating-container">
                    <label><input type="radio" name="rating" value="1" required> 1 ☆</label>
                    <label><input type="radio" name="rating" value="2"> 2 ☆</label>
                    <label><input type="radio" name="rating" value="3"> 3 ☆</label>
                    <label><input type="radio" name="rating" value="4"> 4 ☆</label>
                    <label><input type="radio" name="rating" value="5"> 5 ☆</label>
                </div>
            </fieldset>

            <div class="form-group">
                <label for="install-date">Date of Installation <span class="required">*</span></label>
                <input type="date" id="install-date" name="installDate" required>
            </div>

            <fieldset class="form-group">
                <legend>Useful Features (Check all that apply)</legend>
                <div class="checkbox-container">
                    <label><input type="checkbox" name="features" value="durability"> Durability</label>
                    <label><input type="checkbox" name="features" value="ease-of-use"> Ease of Use</label>
                    <label><input type="checkbox" name="features" value="performance"> Performance</label>
                    <label><input type="checkbox" name="features" value="design"> Design</label>
                </div>
            </fieldset>

            <div class="form-group">
                <label for="written-review">Written Review (Optional)</label>
                <textarea id="written-review" name="writtenReview" rows="5" placeholder="Share your experience..."></textarea>
            </div>

            <div class="form-group">
                <label for="user-name">Your Name (Optional)</label>
                <input type="text" id="user-name" name="userName" placeholder="e.g., John Doe">
            </div>

            <input type="submit" value="Submit Review" class="submit-btn">
        </form>
    </main>

    <footer>
        <p>&copy; <span id="current-year"></span> | Dairy | WDD 131 Assignment</p>
    </footer>
</body>
</html>
